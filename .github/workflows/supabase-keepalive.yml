# Keeps the free Supabase project from pausing for inactivity.
# Supabase pauses Free-plan projects after about a week with too little
# database activity. Twice a week this reads the top leaderboard rows through
# the same public REST API the game uses (the publishable key is already
# public in index.html; Row Level Security only allows reads and inserts).
# Run it by hand any time from the repo's Actions tab.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 15 * * 1,4" # Mondays and Thursdays, 15:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the leaderboard
        run: |
          url="https://uedpviwvuenqlktkalgq.supabase.co/rest/v1/scores?select=score&order=score.desc&limit=5"
          key="sb_publishable_xdpTXLcfBaD-kP1WTT4E2w_IcJGuNy8"
          code=$(curl -sS -o body.json -w "%{http_code}" "$url" -H "apikey: $key")
          echo "HTTP $code"
          cat body.json
          echo
          test "$code" = "200"
